name: Sync latest model package

on:
  push:
    branches:
      - sync-latest-model-package
    paths:
      - .sync/GO

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble latest package files
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/config.*.gz.b64 | base64 -d | gzip -d > config/predict_valid_class_v1.json
          cat .sync/meta.*.gz.b64 | base64 -d | gzip -d > models/neural_lstm_valid_class_all_v1_meta.json
          cat .sync/enrich.*.gz.b64 | base64 -d | gzip -d > scripts/enrich_result_for_1c_v6.py
          cat .sync/predict.*.gz.b64 | base64 -d | gzip -d > scripts/predict_valid_class_all_v1.py
          cat .sync/run.*.gz.b64 | base64 -d | gzip -d > scripts/run_from_1c_full_analysis.py
          rm -f scripts/run_from_1c_full_analysis_core.py
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('│   ├── run_from_1c_full_analysis_core.py\n', '')
          s = s.replace(
              'Точкой запуска для 1С остаётся `run_from_1c_full_analysis.py`; общая вспомогательная логика вынесена в `run_from_1c_full_analysis_core.py`.',
              'Точкой запуска для 1С является `run_from_1c_full_analysis.py`; актуальная логика интеграции находится в этом файле.'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('config/predict_valid_class_v1.json'),
              Path('models/neural_lstm_valid_class_all_v1_meta.json'),
          ]:
              with p.open(encoding='utf-8-sig') as f:
                  json.load(f)
          PY
          python -m py_compile \
            scripts/enrich_result_for_1c_v6.py \
            scripts/predict_valid_class_all_v1.py \
            scripts/run_from_1c_full_analysis.py
          test "$(git hash-object config/predict_valid_class_v1.json)" = "414884af4c160a3dc3c63a7ecb8a77b685c98685"
          test "$(git hash-object models/neural_lstm_valid_class_all_v1_meta.json)" = "5d5dd8f78833e1d65f9f6f7eb8aa6d2061f4de56"
          test "$(git hash-object scripts/enrich_result_for_1c_v6.py)" = "041d00570f8f1cf3a9586cf831b34dac9d38d245"
          test "$(git hash-object scripts/predict_valid_class_all_v1.py)" = "000065a6afd4eb7996da0eb2cff6a2ec2c7e81f0"
          test "$(git hash-object scripts/run_from_1c_full_analysis.py)" = "d8a664666b0a7d371258cc3ba8ecf39bd2197710"
          test ! -e scripts/run_from_1c_full_analysis_core.py
          ! grep -q 'run_from_1c_full_analysis_core.py' README.md

      - name: Commit synchronized package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/sync-models-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync analysis files from latest models package [skip ci]"
          git push origin HEAD:sync-latest-model-package
